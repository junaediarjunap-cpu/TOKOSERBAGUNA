<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Online Minuman Segar</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #333;
    }
    header {
      background: linear-gradient(90deg, #ff7e5f, #feb47b);
      color: white;
      text-align: center;
      padding: 20px;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin: 15px;
      width: 280px;
      transition: transform 0.3s;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card img {
      width: 100%;
      border-radius: 10px 10px 0 0;
    }
    .card h3 {
      margin: 15px;
    }
    .card p {
      margin: 0 15px 15px;
      color: #666;
    }
    .btn {
      display: block;
      text-align: center;
      margin: 15px;
      padding: 10px;
      background: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }
    .btn:hover {
      background: #128C7E;
    }
  </style>
</head>
<body>
  <header>
    <h1>🍹 Toko Minuman Segar</h1>
    <p>Jus • Capung/Gatrum • Es Degan</p>
  </header>

  <div class="container">
    <!-- Produk Jus -->
    <div class="card">
      <img src="https://source.unsplash.com/400x300/?juice" alt="Jus Segar">
      <h3>Jus Segar</h3>
      <p>Aneka jus buah pilihan, segar dan sehat.</p>
      <a class="btn" href="https://wa.me/6281234567890?text=Halo%20saya%20ingin%20pesan%20Jus%20Segar">Pesan via WhatsApp</a>
    </div>

    <!-- Produk Capung/Gatrum -->
    <div class="card">
      <img src="https://source.unsplash.com/400x300/?herbal,drink" alt="Capung/Gatrum">
      <h3>Capung / Gatrum</h3>
      <p>Minuman tradisional khas, nikmat dan menyehatkan.</p>
      <a class="btn" href="https://wa.me/6281234567890?text=Halo%20saya%20ingin%20pesan%20Capung/Gatrum">Pesan via WhatsApp</a>
    </div>

    <!-- Produk Es Degan -->
    <div class="card">
      <img src="https://source.unsplash.com/400x300/?coconut,drink" alt="Es Degan">
      <h3>Es Degan</h3>
      <p>Kelapa muda segar dengan es, pelepas dahaga alami.</p>
      <a class="btn" href="https://wa.me/6281234567890?text=Halo%20saya%20ingin%20pesan%20Es%20Degan">Pesan via WhatsApp</a>
    </div>
  </div>
</body>
</html>
