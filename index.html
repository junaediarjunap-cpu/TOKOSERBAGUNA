<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Serba Ada - Berkah Jaya</title>
  <style>
    :root {
      --primary: #25D366;
      --primary-dark: #128C7E;
      --dark: #333;
      --light: #f4f4f9;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--light);
      color: var(--dark);
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: var(--white);
      text-align: center;
      padding: 2rem 1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1rem;
      opacity: 0.9;
    }

    .container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    /* Section Produk */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background: var(--white);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
    }

    .product-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background-color: #eee;
    }

    .product-info {
      padding: 1rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .product-price {
      color: var(--primary-dark);
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .btn-add {
      width: 100%;
      background-color: var(--primary);
      color: var(--white);
      border: none;
      padding: 0.6rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background-color: var(--primary-dark);
    }

    /* Section Keranjang & Form */
    .cart-section {
      background: var(--white);
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      height: fit-content;
    }

    .cart-section h2 {
      font-size: 1.3rem;
      margin-bottom: 1rem;
      border-bottom: 2px solid var(--light);
      padding-bottom: 0.5rem;
    }

    .cart-items {
      list-style: none;
      margin-bottom: 1rem;
      max-height: 250px;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid #eee;
      font-size: 0.9rem;
    }

    .cart-item-controls button {
      background: #ff4d4d;
      color: white;
      border: none;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .cart-total {
      font-weight: bold;
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
      margin: 1rem 0;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 0.3rem;
      font-weight: 600;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .btn-checkout {
      width: 100%;
      background-color: #25D366;
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-checkout:hover {
      background-color: #1ebc57;
    }
  </style>
</head>
<body>

  <header>
    <h1>Toko Berkah Nusantara</h1>
    <p>Pesan Produk Pilihan Anda & Checkout Langsung via WhatsApp</p>
  </header>

  <div class="container">
    <!-- Daftar Produk -->
    <div class="products-grid">

      <!-- Produk 1 -->
      <div class="product-card">
        <img src="H51a2cdffeb3b43e3b567a3fbe745a353l.jpg" alt="Gantungan Kunci Capung" class="product-img">
        <div class="product-info">
          <div>
            <div class="product-title">Gantungan Kunci Capung</div>
            <div class="product-price">Rp 15.000</div>
          </div>
          <button class="btn-add" onclick="tambahKeKeranjang('Gantungan Kunci Capung', 15000)">+ Keranjang</button>
        </div>
      </div>

      <!-- Produk 2 -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1546173159-315724a31696?w=400&auto=format&fit=crop&q=60" alt="Es Jus Mangga" class="product-img">
        <div class="product-info">
          <div>
            <div class="product-title">Es Jus Mangga</div>
            <div class="product-price">Rp 10.000</div>
          </div>
          <button class="btn-add" onclick="tambahKeKeranjang('Es Jus Mangga', 10000)">+ Keranjang</button>
        </div>
      </div>

      <!-- Produk 3 -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1556881286-fc6915169721?w=400&auto=format&fit=crop&q=60" alt="Es Cincau" class="product-img">
        <div class="product-info">
          <div>
            <div class="product-title">Es Cincau Segar</div>
            <div class="product-price">Rp 8.000</div>
          </div>
          <button class="btn-add" onclick="tambahKeKeranjang('Es Cincau Segar', 8000)">+ Keranjang</button>
        </div>
      </div>

    </div>

    <!-- Ringkasan Keranjang & Form Checkout -->
    <div class="cart-section">
      <h2>Keranjang Belanja</h2>
      <ul class="cart-items" id="cart-list">
        <li style="color: #777; text-align: center;">Keranjang masih kosong</li>
      </ul>

      <div class="cart-total">
        <span>Total:</span>
        <span id="total-harga">Rp 0</span>
      </div>

      <h2>Data Pemesan</h2>
      <form id="checkout-form" onsubmit="checkoutWA(event)">
        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" placeholder="Masukkan nama Anda" required>
        </div>
        <div class="form-group">
          <label for="alamat">Alamat Pengiriman</label>
          <textarea id="alamat" rows="2" placeholder="Masukkan alamat lengkap" required></textarea>
        </div>
        <button type="submit" class="btn-checkout">
          Checkout via WhatsApp
        </button>
      </form>
    </div>
  </div>

  <script>
    // ==========================================
    // UBAH NOMOR WHATSAPP ANDA DI SINI
    // Format: Gunakan kode negara 62 di depan tanpa '+' atau '0'
    // Contoh: "6281234567890"
    // ==========================================
    const nomorWA = "6282245915267"; 

    let keranjang = [];

    function tambahKeKeranjang(nama, harga) {
      const item = keranjang.find(i => i.nama === nama);
      if (item) {
        item.jumlah += 1;
      } else {
        keranjang.push({ nama, harga, jumlah: 1 });
      }
      updateKeranjang();
    }

    function hapusItem(nama) {
      keranjang = keranjang.filter(item => item.nama !== nama);
      updateKeranjang();
    }

    function updateKeranjang() {
      const cartList = document.getElementById('cart-list');
      const totalHargaElem = document.getElementById('total-harga');
      cartList.innerHTML = '';

      if (keranjang.length === 0) {
        cartList.innerHTML = '<li style="color: #777; text-align: center;">Keranjang masih kosong</li>';
        totalHargaElem.innerText = 'Rp 0';
        return;
      }

      let total = 0;
      keranjang.forEach(item => {
        const subtotal = item.harga * item.jumlah;
        total += subtotal;

        const li = document.createElement('li');
        li.className = 'cart-item';
        li.innerHTML = `
          <div>
            <strong>${item.nama}</strong><br>
            <small>${item.jumlah} x Rp ${item.harga.toLocaleString('id-ID')}</small>
          </div>
          <div class="cart-item-controls">
            <span>Rp ${subtotal.toLocaleString('id-ID')}</span>
            <button onclick="hapusItem('${item.nama}')">X</button>
          </div>
        `;
        cartList.appendChild(li);
      });

      totalHargaElem.innerText = `Rp ${total.toLocaleString('id-ID')}`;
    }

    function checkoutWA(event) {
      event.preventDefault();

      if (keranjang.length === 0) {
        alert('Keranjang Anda masih kosong. Silahkan pilih produk terlebih dahulu.');
        return;
      }

      const nama = document.getElementById('nama').value;
      const alamat = document.getElementById('alamat').value;

      let pesan = `Halo, saya mau pesan barang dari toko:\n\n`;
      pesan += `*Nama:* ${nama}\n`;
      pesan += `*Alamat:* ${alamat}\n\n`;
      pesan += `*Daftar Pesanan:*\n`;

      let total = 0;
      keranjang.forEach((item, index) => {
        const subtotal = item.harga * item.jumlah;
        total += subtotal;
        pesan += `${index + 1}. ${item.nama} (${item.jumlah}x) = Rp ${subtotal.toLocaleString('id-ID')}\n`;
      });

      pesan += `\n*Total Pembayaran:* Rp ${total.toLocaleString('id-ID')}\n\n`;
      pesan += `Mohon diproses ya, terima kasih!`;

      // Encoding URL pesan WhatsApp
      const url = `https://wa.me/${nomorWA}?text=${encodeURIComponent(pesan)}`;
      
      // Buka tautan WhatsApp di tab baru
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
