<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Online Abay</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f9f9f9; }
    header { background: #2c3e50; color: white; text-align: center; padding: 20px; }
    .container { display: flex; flex-wrap: wrap; justify-content: center; margin: 20px; }
    .item { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin: 15px; padding: 20px; width: 250px; text-align: center; }
    .item h3 { margin: 10px 0; }
    .price { color: #e74c3c; font-weight: bold; margin-bottom: 10px; }
    .btn { background: #27ae60; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; }
    .btn:hover { background: #219150; }
  </style>
</head>
<body>
  <header>
    <h1>Toko Online Abay</h1>
    <p>Makanan & Minuman Lezat</p>
  </header>

  <div class="container">
    <div class="item">
      <h3>Capung Goreng</h3>
      <p class="price">Rp 15.000</p>
      <a class="btn" href="https://wa.me/6281234567890?text=Halo,%20saya%20mau%20beli%20Capung%20Goreng">Pesan via WhatsApp</a>
    </div>

    <div class="item">
      <h3>Jus Segar</h3>
      <p class="price">Rp 10.000</p>
      <a class="btn" href="https://wa.me/6281234567890?text=Halo,%20saya%20mau%20beli%20Jus%20Segar">Pesan via WhatsApp</a>
    </div>

    <div class="item">
      <h3>Tahu Kripsi</h3>
      <p class="price">Rp 12.000</p>
      <a class="btn" href="https://wa.me/6281234567890?text=Halo,%20saya%20mau%20beli%20Tahu%20Kripsi">Pesan via WhatsApp</a>
    </div>
  </div>
</body>
</html>
